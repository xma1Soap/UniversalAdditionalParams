<div id="uap_settings" class="extension_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Universal Additional Parameters</b>
            <span id="uap_status_badge" class="uap_badge">运行中</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="uap_hint">
                让“附加参数”按钮在所有接口显示并生效（原版只对 Custom/兼容接口有效）。
                非 Custom 接口需要配合服务端 chat-completions.js 补丁使用。
            </p>
            <label class="checkbox_label" for="uap_global_enabled">
                <input id="uap_global_enabled" type="checkbox" />
                <span>全局开启（关闭后附加参数完全不发送）</span>
            </label>
            <label class="checkbox_label" for="uap_auto_enabled">
                <input id="uap_auto_enabled" type="checkbox" />
                <span>自动设置参数（按模型自动排除不支持的字段）</span>
            </label>
            <div id="uap_auto_note" class="uap_note">正在检测当前模型…</div>
            <div class="flex-container">
                <div id="uap_open_stock_editor" class="menu_button menu_button_icon">打开附加参数编辑器</div>
            </div>
            <h4>自动排除规则（JSON 数组，命中时合并进“排除参数”随请求发送）</h4>
            <textarea id="uap_rules_json" class="text_pole" rows="10" style="width:100%;height:180px;font-family:monospace;"></textarea>
            <div class="flex-container">
                <div id="uap_rules_save" class="menu_button menu_button_icon">保存规则</div>
            </div>
            <p class="uap_hint">规则字段：name / enabled / sources（来源数组，* 表示全部）/ modelPatterns（模型子串数组，空数组表示全部模型）/ excludeKeys（排除参数名数组）</p>
        </div>
    </div>
</div>
